version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# PulseNet — Local Development Compose
# Database: AWS RDS (no local Postgres container)
# Point DATABASE_URL in .env to your shared AWS RDS instance.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  pulsenet_net:
    driver: bridge

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsenet_backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - pulsenet_net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── React + Vite Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsenet_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pulsenet_net
    ports:
      - "5173:80"       # Nginx serves the built Vite app on port 80 inside container
